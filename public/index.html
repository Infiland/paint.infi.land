<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="paint.infi.land — collaborative drawing canvas with live cursors." />
    <title>paint.infi.land</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply saved theme before first paint to prevent flash
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('paint:theme'); } catch (e) {}
        var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="joinOverlay" class="overlay">
      <div class="modal">
        <h1>paint.infi.land</h1>
        <p class="modal-sub">Collaborative drawing canvas</p>
        <form id="joinForm" class="join-form">
          <input id="usernameInput" name="username" type="text" maxlength="20" required placeholder="Enter your name" autocomplete="off" />
          <div class="join-row">
            <label class="color-field" title="Pick a color">
              <input id="colorInput" name="color" type="color" value="#00e5ff" />
            </label>
            <button id="joinButton" class="join-btn" type="submit">Start drawing</button>
          </div>
          <p id="joinMessage" class="join-message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <canvas id="strokesCanvas"></canvas>
    <canvas id="cursorsCanvas"></canvas>

    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Drawing tools">
      <button type="button" data-tool="pen" class="tool-btn active" title="Pen (1)" aria-label="Pen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
      <button type="button" data-tool="rect" class="tool-btn" title="Rectangle (2)" aria-label="Rectangle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="6" width="14" height="12" rx="2"/>
        </svg>
      </button>
      <button type="button" data-tool="circle" class="tool-btn" title="Circle (3)" aria-label="Circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="6"/>
        </svg>
      </button>
      <button type="button" data-tool="text" class="tool-btn" title="Text (4)" aria-label="Text">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <button type="button" data-tool="eraser" class="tool-btn" title="Eraser (5)" aria-label="Eraser">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 13l-6-6a2 2 0 0 0-2.828 0L3 14.172a2 2 0 0 0 0 2.828L6 20h8l5-5a2 2 0 0 0 0-2.828z"/>
          <path d="M6 20l-3-3"/>
        </svg>
      </button>
      <button type="button" data-tool="pan" class="tool-btn" title="Pan (6)" aria-label="Pan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 9 2 12 5 15"/>
          <polyline points="9 5 12 2 15 5"/>
          <polyline points="15 19 12 22 9 19"/>
          <polyline points="19 9 22 12 19 15"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <line x1="12" y1="2" x2="12" y2="22"/>
        </svg>
      </button>

      <span class="toolbar-sep" aria-hidden="true"></span>

      <label class="color-swatch" title="Stroke color">
        <input id="colorPicker" type="color" aria-label="Stroke color" />
      </label>

      <button id="smoothingToggle" type="button" class="tool-btn" aria-pressed="true" title="Smoothing (S)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/>
        </svg>
      </button>

      <span class="toolbar-sep" aria-hidden="true"></span>

      <button id="themeToggle" type="button" class="tool-btn" title="Toggle dark mode (D)" aria-label="Toggle dark mode">
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <div class="hud-left">
      <span id="zoomLevel" class="zoom-label">100%</span>
    </div>

    <div id="mobileControls" class="hud-right">
      <button id="zoomInBtn" type="button" class="zoom-btn" title="Zoom In" aria-label="Zoom In">+</button>
      <button id="zoomOutBtn" type="button" class="zoom-btn" title="Zoom Out" aria-label="Zoom Out">&minus;</button>
      <button id="resetViewBtn" type="button" class="zoom-btn" title="Reset View" aria-label="Reset View">1:1</button>
    </div>

    <script>
      window.__loadMain = function () {
        function loadMainWith(version) {
          var s = document.createElement('script');
          s.type = 'module';
          s.src = '/main.js' + (version ? ('?v=' + encodeURIComponent(version)) : '');
          document.head.appendChild(s);
        }

        try {
          fetch('/meta.json', { cache: 'no-store' })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              var v = data && data.buildTime ? data.buildTime : String(Date.now());
              loadMainWith(v);
            })
            .catch(function () { loadMainWith(String(Date.now())); });
        } catch (e) {
          loadMainWith(String(Date.now()));
        }
      };
    </script>
    <script src="/socket.io/socket.io.js"
            onload="window.__loadMain && window.__loadMain()"
            onerror="(function(){var s=document.createElement('script'); s.src='https://cdn.socket.io/4.8.1/socket.io.min.js'; s.crossOrigin='anonymous'; s.onload=function(){window.__loadMain && window.__loadMain()}; document.head.appendChild(s);}())">
    </script>
  </body>
</html>
